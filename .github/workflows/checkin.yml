name: Trae Daily Checkin

on:
  schedule:
    # UTC 时间。23 16 * * * = 北京时间 00:23（避开整点，成功率最高）
    - cron: "23 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 必须保留。refreshToken 是轮换链，续期后旧值作废；Actions 工作目录
      # 是一次性的，靠这个缓存把新 token 带到下一次运行。
      # 删掉这段 → 第二次运行必然失败。
      - uses: actions/cache@v4
        with:
          path: .trae_token_cache.json
          key: trae-token-${{ github.run_id }}
          restore-keys: |
            trae-token-

      - name: Write accounts.json
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          python -c "import os,sys; s=os.environ.get('ACCOUNTS_JSON','').strip(); sys.exit('secret ACCOUNTS_JSON is empty') if not s else open('accounts.json','w',encoding='utf-8').write(s)"
          python -c "import json; d=json.load(open('accounts.json',encoding='utf-8')); a=d.get('accounts') if isinstance(d,dict) else d; print('accounts:',len(a),'deviceIds:',[x.get('deviceId') for x in a],'hasToken:',[bool(x.get('refreshToken')) for x in a])"

      - name: Run checkin
        run: python 03_checkin.py
